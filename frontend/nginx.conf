# Static file serving only.
#
# This container does not proxy the API. The web app and the API are separate
# deployments on separate origins, and the browser calls the API directly using
# the absolute URL baked in at build time as VITE_API_BASE_URL. That is why the
# API must list this origin in CORS_ORIGINS - nothing here can paper over it.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing: React Router owns every path, so anything that is not
    # a real file falls back to the app shell rather than 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Asset filenames carry a content hash, so a given URL never changes content
    # and can be cached indefinitely.
    location /assets/ {
        try_files $uri =404;
        # One header, not `expires` plus `add_header` - those emit two
        # Cache-Control lines and leave the browser to reconcile them.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html is the one file that must never be cached: it is what points at
    # the current asset hashes, so a stale copy asks for bundles that the last
    # deploy deleted.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # The app never receives uploads; the default 1m body limit is already
    # generous for a static host.
    client_max_body_size 1m;
}
