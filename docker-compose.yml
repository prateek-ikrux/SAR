# Two independent deployments that happen to be brought up together.
#
# The web container serves static files and nothing else - it does not proxy the
# API. The browser loads the app from one origin and calls the API on another, so
# both containers publish a host port and CORS is what makes the pair work.
#
# Override the ports with WEB_PORT / API_PORT in a .env file next to this one.

services:
  api:
    build:
      context: ./backend
    image: ikrux-candidate-search-api
    restart: unless-stopped
    # Configuration comes from backend/.env, which is gitignored and never
    # baked into the image. Copy backend/.env.example to start.
    env_file:
      - ./backend/.env
    environment:
      # Compose decides the web app's published port, so compose also decides
      # the origin the API must accept - keeping these two from drifting apart
      # is worth overriding whatever backend/.env says.
      CORS_ORIGINS: http://localhost:${WEB_PORT:-8080}
    # Published: the browser talks to this container directly, so it has to be
    # reachable from the host rather than only from the compose network.
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: ./frontend
      args:
        # Baked into the bundle at build time, so changing API_PORT means
        # rebuilding this image, not just restarting it. localhost is correct
        # here because the browser runs on the Docker host; a real deployment
        # passes the API's public URL instead.
        VITE_API_BASE_URL: http://localhost:${API_PORT:-8000}
    image: ikrux-candidate-search-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    # Not a hard requirement - the static files serve fine on their own. It just
    # avoids handing someone a sign-in screen that cannot reach the API yet.
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
