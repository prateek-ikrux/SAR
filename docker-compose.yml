services:
  api:
    build: .
    image: sar-api:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    image: sar-web:latest
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
