[project]
name = "candidate-search"
version = "0.1.0"
description = "ikrux Candidate Search - vector search and retrieval over the resume corpus"
requires-python = ">=3.12"
dependencies = [
    # [standard] pulls in uvicorn[standard], httpx, email-validator,
    # python-multipart and the `fastapi` CLI, so none of those are listed again.
    "fastapi[standard]>=0.118",
    "pymongo>=4.13,<5",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "pyjwt>=2.10",
    "argon2-cffi>=25.1",
    "minio>=7.2",
]

[dependency-groups]
dev = [
    "ruff>=0.14",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
